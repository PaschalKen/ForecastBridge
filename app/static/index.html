<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForecastBridge</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>ForecastBridge</h1>
      <label>
        Location
        <select id="location-select"></select>
      </label>
    </header>

    <!-- Shown while loading, or when something goes wrong -->
    <p id="status" role="status"></p>

    <!-- "Right now" summary: filled in by app.js -->
    <h2 class="now-heading">Right now <span id="now-time"></span></h2>
    <section id="now" class="cards">
      <div class="card"><span class="label">Temperature</span><span id="now-temp" class="value">–</span></div>
      <div class="card"><span class="label">Chance of rain</span><span id="now-rain" class="value">–</span></div>
      <div class="card"><span class="label">Wind</span><span id="now-wind" class="value">–</span></div>
    </section>

    <!-- Plain-language advice for the next 12 hours: filled in by app.js from GET /advice -->
    <section class="advice-panel">
      <h2 class="now-heading">Next 12 hours</h2>
      <ul id="advice-list" class="advice-list"></ul>
    </section>

    <!-- 48-hour chart: drawn by Chart.js into this canvas -->
    <section class="chart-panel">
      <div class="chart-toolbar">
        <h2>Next 48 hours</h2>
        <button id="now-button" type="button" disabled>Show now</button>
      </div>
      <!-- On phones the inner box is wider than the screen, so the chart scrolls sideways -->
      <div id="chart-scroll" class="chart-box">
        <div class="chart-inner">
          <canvas id="forecast-chart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <!-- Chart.js from a CDN (pinned version), then our own script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
